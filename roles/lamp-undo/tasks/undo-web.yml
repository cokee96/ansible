---
- name: Ensure SELinux Python libs are installed (CentOS/RHEL 7)
  package:
    name: libsemanage-python
    state: present
  when: ansible_distribution_major_version | int == 7

- name: Ensure SELinux Python libs are installed (CentOS/RHEL 8+)
  package:
    name: python3-libsemanage
    state: present
  when: ansible_distribution_major_version | int >= 8

- name: Remove the code copied from repository
  file:
    path: /var/www/html
    state: absent

- name: Disable and stop httpd service
  service:
    name: httpd
    state: stopped
    enabled: no
  ignore_errors: yes

- name: Set SELinux to deny httpd to connect to remote database
  seboolean:
    name: httpd_can_network_connect_db
    state: false
    persistent: yes

- name: Remove web role specific dependencies
  package:
    name: "{{ item }}"
    state: absent
  loop:
    - git
    - httpd
    - php
    - php-mysql
  ignore_errors: yes
